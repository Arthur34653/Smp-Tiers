<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCTiers | Official Rankings</title>
    <!-- Google Fonts for High-Aura Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Core Styling & Dark Theme Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header & Navigation */
        header {
            background-color: #13151a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 10%;
            border-bottom: 2px solid #1f232b;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .logo span {
            color: #ff3e3e;
            text-shadow: 0 0 10px rgba(255, 62, 62, 0.5);
        }

        nav a {
            color: #94a3b8;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 700;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: #ffffff;
        }

        /* Content Intro */
        main {
            flex: 1;
            padding: 40px 10%;
        }

        .intro {
            text-align: center;
            margin-bottom: 40px;
        }

        .intro h1 {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .intro p {
            color: #64748b;
        }

        /* Tier List Rows */
        .tier-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .tier-row {
            background-color: #13151a;
            border: 1px solid #1f232b;
            border-radius: 8px;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .tier-label {
            width: 80px;
            padding: 25px 0;
            font-size: 20px;
            font-weight: 900;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            align-self: stretch;
        }

        .player-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 15px 25px;
        }

        /* Player Profile Cards */
        .player-card {
            background-color: #1c1f26;
            border: 1px solid #2a303c;
            border-radius: 6px;
            display: flex;
            align-items: center;
            padding: 8px 14px;
            gap: 10px;
        }

        .player-card img {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            image-rendering: pixelated; /* Keeps MC avatars sharp */
        }

        .player-name {
            font-weight: 700;
            font-size: 14px;
        }

        /* Region Tags */
        .region {
            font-size: 10px;
            font-weight: 900;
            padding: 2px 5px;
            border-radius: 4px;
            background-color: #334155;
        }
        .tag-na { color: #60a5fa; background-color: rgba(96, 165, 250, 0.1); }
        .tag-eu { color: #facc15; background-color: rgba(250, 204, 21, 0.1); }
        .tag-as { color: #f43f5e; background-color: rgba(244, 63, 94, 0.1); }

        /* Color Themes per Tier Level */
        .ht1 .tier-label { background-color: #ff3e3e; color: #fff; text-shadow: 0 0 8px rgba(255,62,62,0.6); }
        .lt1 .tier-label { background-color: #ff823e; color: #fff; text-shadow: 0 0 8px rgba(255,130,62,0.6); }
        .ht2 .tier-label { background-color: #ffc43e; color: #13151a; }

        footer {
            text-align: center;
            padding: 20px;
            color: #475569;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <header>
        <div class="logo">MC<span>TIERS</span></div>
        <nav>
            <a href="#" class="active">Rankings</a>
            <a href="#">Information</a>
            <a href="#">Changelog</a>
        </nav>
    </header>

    <!-- Main Container -->
    <main>
        <section class="intro">
            <h1>OFFICIAL PVP TIERLIST</h1>
            <p>The definitive player rankings for our competitive community.</p>
        </section>

        <!-- TIER CONTAINER START -->
        <div class="tier-list">

            <!-- HT1 / TIER 1 -->
            <div class="tier-row ht1">
                <div class="tier-label">HT1</div>
                <div class="player-grid">
                    <div class="player-card">
                        <img src="https://mc-heads.net/avatar/V0RT6X/40" alt="V0RT6X">
                        <span class="player-name">V0RT6X</span>
                        <span class="region tag-na">NA</span>
                    </div>
                    <div class="player-card">
                        <img src="https://mc-heads.net/avatar/Harryhipkins/40" alt="Harry">
                        <span class="player-name">Harry</span>
                        <span class="region tag-eu">EU</span>
                    </div>
                </div>
            </div>

            <!-- LT1 / TIER 2 -->
            <div class="tier-row lt1">
                <div class="tier-label">LT1</div>
                <div class="player-grid">
                    <div class="player-card">
                        <img src="https://mc-heads.net/avatar/Notch/40" alt="Player">
                        <span class="player-name">Notch</span>
                        <span class="region tag-na">NA</span>
                    </div>
                </div>
            </div>

            <!-- HT2 / TIER 3 -->
            <div class="tier-row ht2">
                <div class="tier-label">HT2</div>
                <div class="player-grid">
                    <div class="player-card">
                        <img src="https://mc-heads.net/avatar/Minemanner/40" alt="Player">
                        <span class="player-name">Minemanner</span>
                        <span class="region tag-as">AS</span>
                    </div>
                </div>
            </div>

        </div>
        <!-- TIER CONTAINER END -->
    </main>

    <footer>
        <p>&copy; 2026 MCTiers Layout. Driven by the community.</p>
    </footer>

</body>
</html>
